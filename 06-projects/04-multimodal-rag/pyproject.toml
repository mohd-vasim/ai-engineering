[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal rag"
version = "0.1.0"
description = "Source of all projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "gradio>=6.3.0",
    "jinja2>=3.1.6",
    "langchain>=1.2.4",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.0",
    "langchain-openai>=1.1.7",
    "langchain-qdrant>=1.1.0",
    "langchain-tavily>=0.2.16",
    "pdfplumber>=0.11.9",
    "pypdf>=6.6.0",
    "python-dotenv>=1.2.1",
    "qdrant-client>=1.16.2",
    "slowapi>=0.1.9",
    "streamlit>=1.53.0",
    "uvicorn>=0.40.0",
]


[tool.setuptools.packages.find]
include = ["mm_rag*"]
