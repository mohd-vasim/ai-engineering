[project]
name = "cot-meeting-analysis"
version = "0.1.0"
description = "Context Chaining Meeting Analysis with LangGraph, NVIDIA Nemotron, and Databricks MLflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.11",
    "langchain-nvidia-ai-endpoints>=1.4.2",
    "langchain-openai>=1.4.0",
    "langgraph>=1.2.10",
    "mlflow>=3.14.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
