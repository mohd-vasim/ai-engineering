[project]
name = "video-rag-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "qdrant-client[fastembed]>=1.18.0",
    "httpx>=0.27.0",
    "langchain>=1.3.12",
    "langchain-openai>=1.3.4",
    "langchain-openrouter>=0.2.6",
    "langchain-ollama>=1.1.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "streamlit>=1.53.0",
]

[tool.setuptools.packages.find]
where = ["src"]
